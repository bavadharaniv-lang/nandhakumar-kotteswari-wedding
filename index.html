<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kotteswari & Nandhakumar — Wedding Invitation</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Alex+Brush&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-cream: #faf5ec;
      --card-cream: #f3eae0;
      --brown-text: #4a2c11;
      --gold-accent: #c59b27;
      --brown-btn: #5c3818;
      --font-serif: 'Cormorant Garamond', serif;
      --font-calligraphy: 'Alex Brush', cursive;
      --font-sans: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #dfd5c2;
      font-family: var(--font-sans);
      color: var(--brown-text);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Floating Music Icon */
    .music-btn {
      position: fixed;
      bottom: 25px;
      right: 20px;
      width: 48px;
      height: 48px;
      background: var(--brown-btn);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 1001;
      font-size: 1.1rem;
    }

    /* Falling Petals Effect */
    #petal-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2500;
    }

    .petal {
      position: absolute;
      top: -20px;
      background: #ffb7c5;
      border-radius: 150% 0 150% 0;
      opacity: 0.8;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-5vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main App Container with Temple Artwork Frame */
    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-cream);
      background-image: 
        radial-gradient(circle at top, rgba(255,255,255,0.7), rgba(250,245,236,0.95)),
        url('https://images.unsplash.com/photo-1542640244-7e672d6cef4e?auto=format&fit=crop&q=80&w=800');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      box-shadow: 0 0 30px rgba(0,0,0,0.15);
      position: relative;
      padding-bottom: 50px;
      overflow: hidden;
    }

    /* Decorative Temple Frame Borders */
    .app-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 12px solid transparent;
      border-image: linear-gradient(to bottom, #d4a753, #5c3818) 1;
      pointer-events: none;
      z-index: 10;
      opacity: 0.3;
    }

    /* ================= ENVELOPE OPENING SCREEN ================= */
    #envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #e8decb;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 1.2s ease-in-out, opacity 1s ease;
      padding: 20px;
    }

    #envelope-screen.opened {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .envelope-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-cream);
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
      text-align: center;
      border: 1px solid #e2d7c5;
    }

    .envelope-flap {
      background: #f7f0e4;
      padding: 40px 20px 30px;
      clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%);
      position: relative;
      border-bottom: 1px solid #e2d7c5;
    }

    .monogram-logo {
      font-family: var(--font-calligraphy);
      font-size: 3.8rem;
      color: var(--brown-text);
      line-height: 0.9;
      margin-bottom: 10px;
      display: inline-block;
      position: relative;
    }
    .monogram-logo::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: -10%;
      width: 120%;
      height: 2px;
      background: radial-gradient(circle, var(--brown-text) 0%, transparent 100%);
      border-radius: 50%;
    }

    .couple-names-cover {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--brown-text);
      line-height: 1.2;
    }

    .couple-names-cover span {
      display: block;
      font-size: 0.9rem;
      color: #8c6d53;
      letter-spacing: 3px;
      margin: 4px 0;
      font-family: var(--font-sans);
    }

    .tap-open-btn {
      background: var(--brown-btn);
      color: #ffffff;
      border: none;
      padding: 14px 40px;
      border-radius: 25px;
      font-size: 1rem;
      font-family: var(--font-sans);
      cursor: pointer;
      margin-top: 25px;
      box-shadow: 0 4px 12px rgba(92, 56, 24, 0.3);
      transition: transform 0.2s;
      position: relative;
      z-index: 3005;
    }

    .tap-open-btn:hover {
      transform: scale(1.05);
    }

    .wax-seal {
      width: 65px;
      height: 65px;
      background: radial-gradient(circle, #d4a753 0%, #b38634 100%);
      border-radius: 50%;
      margin: -25px auto 20px;
      position: relative;
      z-index: 3005;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.6rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
      border: 3px solid #e0be6c;
      cursor: pointer;
    }

    .envelope-bottom {
      padding: 10px 20px 35px;
    }

    .invite-text-cover {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #7a5c43;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .leaf-illustration {
      color: #7a5c43;
      font-size: 1.5rem;
    }

    /* ================= MAIN CONTENT ================= */
    section {
      padding: 35px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .quote-box {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.1rem;
      color: #614328;
      margin: 15px 0 25px;
      line-height: 1.6;
    }

    .couple-title {
      font-family: var(--font-serif);
      color: var(--brown-text);
      font-size: 2.3rem;
      line-height: 1.2;
    }

    .weds-script {
      font-family: var(--font-calligraphy);
      font-size: 2.5rem;
      color: var(--gold-accent);
      margin: 4px 0;
    }

    /* Countdown Pill */
    .countdown-pill {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e0d5c3;
      padding: 10px 20px;
      border-radius: 30px;
      display: inline-flex;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin: 25px 0;
    }

    .time-unit {
      text-align: center;
    }

    .time-unit span {
      display: block;
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--brown-text);
    }

    .time-unit small {
      font-size: 0.55rem;
      letter-spacing: 1px;
      color: #8c6d53;
      text-transform: uppercase;
    }

    .role-badge {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #8c6d53;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .event-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e8decb;
      border-radius: 12px;
      padding: 25px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .event-card h3 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--brown-text);
      margin-bottom: 10px;
    }

    .event-date-text {
      font-size: 0.95rem;
      color: #614328;
      line-height: 1.8;
    }

    /* Auto Scroll Carousel */
    .carousel-wrapper {
      position: relative;
      width: 100%;
      margin: 20px 0 10px;
    }

    .gallery-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 15px;
      padding: 10px 0;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .gallery-container::-webkit-scrollbar { display: none; }

    .gallery-item {
      flex: 0 0 85%;
      scroll-snap-align: center;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e2d7c5;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      background: #ffffff;
    }

    .gallery-item img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d8cebd;
      transition: background 0.3s, transform 0.3s;
    }

    .dot.active {
      background: var(--brown-btn);
      transform: scale(1.3);
    }

    /* Calendar Box with Red Heart Highlight */
    .calendar-box {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e8decb;
      border-radius: 12px;
      padding: 20px 15px;
      margin-top: 15px;
    }

    .calendar-month {
      color: var(--brown-text);
      font-family: var(--font-serif);
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      font-size: 0.85rem;
      color: #614328;
    }

    .calendar-grid div { padding: 6px 0; }
    .calendar-grid .day-name { font-weight: 600; color: #8c6d53; }
    
    .calendar-grid .selected-day-heart {
      background: #e63946;
      color: #ffffff;
      clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transform: scale(1.2);
    }

    /* Form Fields */
    .form-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e8decb;
      border-radius: 12px;
      padding: 25px 20px;
      text-align: left;
      margin-top: 15px;
    }

    .form-card h3 {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--brown-text);
      text-align: center;
      margin-bottom: 15px;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      background: var(--bg-cream);
      border: 1px solid #e2d7c5;
      border-radius: 8px;
      margin-bottom: 15px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--brown-text);
    }

    .submit-btn {
      width: 100%;
      background: var(--brown-btn);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Map Box */
    .map-box {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2d7c5;
      margin: 15px 0;
    }

    .map-box iframe {
      width: 100%;
      height: 220px;
      border: 0;
    }
  </style>
</head>
<body>

  <div id="petal-container"></div>

  <!-- Audio Player -->
  <audio id="bg-audio" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>
  
  <!-- Floating Music Toggle -->
  <div class="music-btn" onclick="toggleAudio()">
    <i class="fas fa-music"></i>
  </div>

  <!-- ENVELOPE OPENING COVER SCREEN -->
  <div id="envelope-screen">
